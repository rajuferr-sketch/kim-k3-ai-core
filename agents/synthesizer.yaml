# Synthesizer Agent - manifest
# Loaded by src/kim_k3/agents/registry.py at startup.
name: synthesizer
class: kim_k3.agents.synthesizer_agent.SynthesizerAgent
title: "Synthesizer Agent"
version: 1.0.0
order: 15
enabled: true
always_activate: true          # every request activates this agent (pipeline is mandatory)
role: >
  Combines the results of all agents into one coherent answer.

model:
  tier: deep
  temperature: 0.2
  max_output_tokens: 4096

limits:
  max_steps: 12
  max_credits: 150
  timeout_seconds: 180
  max_delegation_depth: 1

tools:
  - memory.recall

memory:
  read: [working, episodic, semantic]
  write: [working]

inputs:
  - all AgentResults
  - Evaluation
  - SafetyVerdict

outputs:
  - FinalAnswer: text, citations, confidence, open questions

stop_conditions:
  - max_steps reached
  - max_credits reached
  - budget guard refused the next provider call
  - safety verdict is refuse
  - two consecutive empty or malformed outputs

escalation:
  on_failure: report_to_coordinator
  on_policy_hit: safety
  on_budget_exhausted: halt_run
