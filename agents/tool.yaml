# Tool Agent - manifest
# Loaded by src/kim_k3/agents/registry.py at startup.
name: tool
class: kim_k3.agents.tool_agent.ToolAgent
title: "Tool Agent"
version: 1.0.0
order: 8
enabled: true
always_activate: true          # every request activates this agent (pipeline is mandatory)
role: >
  Selects and calls external tools and APIs on behalf of the other agents.

model:
  tier: balanced
  temperature: 0.2
  max_output_tokens: 4096

limits:
  max_steps: 12
  max_credits: 140
  timeout_seconds: 180
  max_delegation_depth: 1

tools:
  - registry.tools
  - http.request

memory:
  read: [working, episodic, semantic]
  write: [working]

inputs:
  - tool intent
  - arguments
  - caller agent identity

outputs:
  - ToolResult: ok, payload, error, latency, credits

stop_conditions:
  - max_steps reached
  - max_credits reached
  - budget guard refused the next provider call
  - safety verdict is refuse
  - two consecutive empty or malformed outputs

escalation:
  on_failure: report_to_coordinator
  on_policy_hit: safety
  on_budget_exhausted: halt_run
