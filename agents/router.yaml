# Router Agent - manifest
# Loaded by src/kim_k3/agents/registry.py at startup.
name: router
class: kim_k3.agents.router_agent.RouterAgent
title: "Router Agent"
version: 1.0.0
order: 1
enabled: true
always_activate: true          # every request activates this agent (pipeline is mandatory)
role: >
  Decides which agents and which model tier every incoming request needs.

model:
  tier: fast
  temperature: 0.0
  max_output_tokens: 4096

limits:
  max_steps: 6
  max_credits: 40
  timeout_seconds: 90
  max_delegation_depth: 1

tools:
  - policy.read
  - catalog.models

memory:
  read: [working, episodic, semantic]
  write: [working]

inputs:
  - raw user request
  - tenant policy
  - credit budget for the run

outputs:
  - RoutingDecision: activated agents, model tiers, per-agent credit caps

stop_conditions:
  - max_steps reached
  - max_credits reached
  - budget guard refused the next provider call
  - safety verdict is refuse
  - two consecutive empty or malformed outputs

escalation:
  on_failure: report_to_coordinator
  on_policy_hit: safety
  on_budget_exhausted: halt_run
