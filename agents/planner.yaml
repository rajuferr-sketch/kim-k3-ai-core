# Planner Agent - manifest
# Loaded by src/kim_k3/agents/registry.py at startup.
name: planner
class: kim_k3.agents.planner_agent.PlannerAgent
title: "Planner Agent"
version: 1.0.0
order: 4
enabled: true
always_activate: true          # every request activates this agent (pipeline is mandatory)
role: >
  Decomposes the problem into objectives, ordered steps and acceptance criteria.

model:
  tier: balanced
  temperature: 0.2
  max_output_tokens: 4096

limits:
  max_steps: 10
  max_credits: 90
  timeout_seconds: 150
  max_delegation_depth: 1

tools:
  - memory.recall

memory:
  read: [working, episodic, semantic]
  write: [working]

inputs:
  - request
  - routing decision
  - evidence

outputs:
  - Plan: steps[] with owner, inputs, acceptance criteria, risk

stop_conditions:
  - max_steps reached
  - max_credits reached
  - budget guard refused the next provider call
  - safety verdict is refuse
  - two consecutive empty or malformed outputs

escalation:
  on_failure: report_to_coordinator
  on_policy_hit: safety
  on_budget_exhausted: halt_run
