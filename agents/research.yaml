# Research Agent - manifest
# Loaded by src/kim_k3/agents/registry.py at startup.
name: research
class: kim_k3.agents.research_agent.ResearchAgent
title: "Research Agent"
version: 1.0.0
order: 3
enabled: true
always_activate: true          # every request activates this agent (pipeline is mandatory)
role: >
  Finds information, primary sources and data relevant to the request.

model:
  tier: balanced
  temperature: 0.2
  max_output_tokens: 4096

limits:
  max_steps: 12
  max_credits: 150
  timeout_seconds: 180
  max_delegation_depth: 1

tools:
  - web.search
  - web.fetch
  - memory.recall

memory:
  read: [working, episodic, semantic]
  write: [working]

inputs:
  - objective
  - known constraints
  - memory recall bundle

outputs:
  - Evidence[] with provenance and confidence

stop_conditions:
  - max_steps reached
  - max_credits reached
  - budget guard refused the next provider call
  - safety verdict is refuse
  - two consecutive empty or malformed outputs

escalation:
  on_failure: report_to_coordinator
  on_policy_hit: safety
  on_budget_exhausted: halt_run
