# Coding Agent - manifest
# Loaded by src/kim_k3/agents/registry.py at startup.
name: coding
class: kim_k3.agents.coding_agent.CodingAgent
title: "Coding Agent"
version: 1.0.0
order: 7
enabled: true
always_activate: true          # every request activates this agent (pipeline is mandatory)
role: >
  Writes, modifies and checks code.

model:
  tier: deep
  temperature: 0.2
  max_output_tokens: 4096

limits:
  max_steps: 20
  max_credits: 250
  timeout_seconds: 300
  max_delegation_depth: 1

tools:
  - repo.read
  - repo.write
  - shell.run
  - code.sandbox

memory:
  read: [working, episodic, semantic]
  write: [working]

inputs:
  - Plan step
  - repository context
  - failing test or spec

outputs:
  - CodeChange: diff, touched files, test evidence

stop_conditions:
  - max_steps reached
  - max_credits reached
  - budget guard refused the next provider call
  - safety verdict is refuse
  - two consecutive empty or malformed outputs

escalation:
  on_failure: report_to_coordinator
  on_policy_hit: safety
  on_budget_exhausted: halt_run
