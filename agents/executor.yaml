# Executor Agent - manifest
# Loaded by src/kim_k3/agents/registry.py at startup.
name: executor
class: kim_k3.agents.executor_agent.ExecutorAgent
title: "Executor Agent"
version: 1.0.0
order: 9
enabled: true
always_activate: true          # every request activates this agent (pipeline is mandatory)
role: >
  Carries out the planned actions that change state in the real world.

model:
  tier: balanced
  temperature: 0.2
  max_output_tokens: 4096

limits:
  max_steps: 16
  max_credits: 200
  timeout_seconds: 240
  max_delegation_depth: 1

tools:
  - tool.invoke
  - repo.write
  - shell.run

memory:
  read: [working, episodic, semantic]
  write: [working]

inputs:
  - approved Plan steps
  - ToolResults
  - approval tokens

outputs:
  - ExecutionReport: performed actions, side effects, rollback notes

stop_conditions:
  - max_steps reached
  - max_credits reached
  - budget guard refused the next provider call
  - safety verdict is refuse
  - two consecutive empty or malformed outputs

escalation:
  on_failure: report_to_coordinator
  on_policy_hit: safety
  on_budget_exhausted: halt_run
