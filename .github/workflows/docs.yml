name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "*.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "*.md"]

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown e link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - name: Verifica link
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 "**/*.md"
          fail: false

  build-site:
    name: Build sito documentazione
    runs-on: ubuntu-latest
    needs: lint-markdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict || echo "mkdocs.yml assente: build saltata"
