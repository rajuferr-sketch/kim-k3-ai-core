name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 45
          days-before-issue-close: 14
          days-before-pr-stale: 21
          days-before-pr-close: 10
          stale-issue-label: "stato: stale"
          stale-pr-label: "stato: stale"
          exempt-issue-labels: "priorità: P0,priorità: P1,tipo: sicurezza,pinned,roadmap"
          exempt-pr-labels: "priorità: P0,work in progress"
          stale-issue-message: >
            Questa issue non ha attività da 45 giorni. Aggiungi un commento se è ancora
            rilevante, altrimenti verrà chiusa tra 14 giorni.
          stale-pr-message: >
            Questa pull request non ha attività da 21 giorni. Aggiorna il branch o commenta,
            altrimenti verrà chiusa tra 10 giorni.
          close-issue-message: "Chiusa automaticamente per inattività. Riaprila pure quando serve."
          close-pr-message: "Chiusa automaticamente per inattività. Riaprila pure quando serve."
